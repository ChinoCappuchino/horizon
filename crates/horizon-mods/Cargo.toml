[package]
name = "horizon-mods"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.95"
description = "Horizon's mod runtime: sandboxed WebAssembly components (docs/mods.md)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1.6"
zip = { version = "2", default-features = false, features = ["deflate"] }
log = "0.4"
# The 48 LTS line: security fixes until August 2028, on the same wasm-tools (0.254) as wit-component and the SDK's wit-bindgen.
wasmtime = { version = "48.0.7", default-features = false, features = ["runtime", "cranelift", "component-model", "std"], optional = true }
# Turns a mod's core module into a component (cargo horizon-mod build, the tests).
wit-component = { version = "0.254", optional = true }
wit-parser = { version = "0.254", optional = true }
# The functions a mod imports, for its API level (src/api_level.rs): the game and the registry index.
wasmparser = { version = "0.254", optional = true }
# The registry index's checks (feature `index`): SHA-256, and minisign signatures (no dependencies of its own).
sha2 = { version = "0.10", optional = true }
minisign-verify = { version = "0.3", optional = true }
# World-generation mods' prefetch threads run only when a core is idle.
horizon-threads = { path = "../horizon-threads", optional = true }
# A world-generation mod as the game's terrain provider (feature `world`).
horizon-world = { path = "../horizon-world", optional = true }
horizon-core = { path = "../horizon-core", optional = true }
# A shader pack's check (kind `shader`): the one the game runs before it loads a pack.
horizon-shader-api = { path = "../horizon-shader-api", optional = true }

[dev-dependencies]
# A component made for a newer Horizon, from the WIT alone (tests/sandbox.rs).
wit-component = { version = "0.254", features = ["dummy-module"] }
wit-parser = "0.254"

[features]
# Loads and runs mods (the game's `mods` feature); without it only manifests,
# content and packaging. Off by default so builds that don't run mods (the
# game's tests and probes) skip wasmtime and cranelift.
runtime = ["dep:wasmtime", "dep:wasmparser", "dep:horizon-threads"]
pack = ["dep:wit-component", "dep:wit-parser"]
# A world-generation mod as horizon-world's terrain provider (worldgen_world.rs).
world = ["runtime", "dep:horizon-world", "dep:horizon-core"]
# The mod registry's index (docs/api/mod-index.md): the launcher, the registry server and its CI.
index = ["dep:sha2", "dep:minisign-verify", "dep:horizon-shader-api", "dep:wasmparser"]

# Runs real mods: `cargo test -p horizon-mods --features runtime,pack`.
[[test]]
name = "sandbox"
required-features = ["runtime", "pack"]

# World-generation mods in the sandbox (capability `worldgen`, fork `NeuHorizon`).
[[test]]
name = "worldgen"
required-features = ["runtime", "pack"]

# A world-generation mod through horizon-world's generator (needs the prepared 26.3 resources).
[[test]]
name = "worldgen_world"
required-features = ["world", "pack"]

# A world-generation mod's terrain in chunks a second: `cargo run --release -p horizon-mods
# --features runtime,pack --example worldgen_bench -- <mod.hmod>`.
[[example]]
name = "worldgen_bench"
required-features = ["runtime", "pack"]

# The fork's world-generation matrix, Horizon's side: vanilla, carried mods' data, or a
# world-generation mod's preset through the real generator (tools/worldgen_probe.py horizon).
[[example]]
name = "worldgen_probe"
required-features = ["world"]

# docs/api/mods-reference.md from the WIT contract (HORIZON_WRITE_DOCS=1 rewrites it).
[[test]]
name = "api_reference"
required-features = ["pack"]

[lints]
workspace = true
